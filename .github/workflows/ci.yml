name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  php-lint:
    name: PHP Lint (${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.3", "8.4", "8.5"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none
      - name: Lint PHP files
        run: |
          set -uo pipefail
          failed=0
          while IFS= read -r -d '' f; do
            out=$(php -l "$f" 2>&1) || true
            printf '%s\n' "$out" | grep -q 'No syntax errors' || { printf '%s\n' "$out"; failed=1; }
          done < <(find . -name '*.php' -not -path './vendor/*' -print0)
          exit $failed
